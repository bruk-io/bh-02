[project]
name = "warden"
version = "0.1.0"
description = "warden: a process supervisor built on cordis, composed the way bh-02 is"
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "click>=8",
    # The shipped layers name these by entry point; the app imports neither.
    "warden-cordis-plugin",
    "warden-systray-cordis-plugin; sys_platform == 'darwin'",
]

[project.scripts]
warden = "warden.cli:main"

[tool.uv.sources]
cordis = { workspace = true }
warden-cordis-plugin = { workspace = true }
warden-systray-cordis-plugin = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]
