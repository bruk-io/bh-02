[project]
name = "warden-systray-cordis-plugin"
version = "0.1.0"
description = "A read-only macOS menu-bar listing of warden's managed processes."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "rumps>=0.4; sys_platform == 'darwin'",
]

[project.entry-points."cordis.plugins"]
warden-systray = "warden_systray_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_systray_cordis_plugin"]
