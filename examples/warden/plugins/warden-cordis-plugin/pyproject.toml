[project]
name = "warden-cordis-plugin"
version = "0.1.0"
description = "Spawns a configured subprocess and terminates it when its row leaves."
requires-python = ">=3.15"
dependencies = [
    "cordis",
]

[project.entry-points."cordis.plugins"]
warden = "warden_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_cordis_plugin"]
