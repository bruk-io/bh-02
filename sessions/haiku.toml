# Long sessions on Haiku 5.5: each conversation asks six questions about one JSON tool result in
# one session (the count, every planted item, four lookups), native against each composition. At M
# the result stays in the context, raw or folded; at L Claude Code spills it, and `all` folds the
# saved output. Two repetitions.
name = "haiku"
model = "claude-haiku-5-5"
bands = ["M", "L"]
formats = ["json"]
reps = 2
max_cost = 4

[[setting]]   # the sample recipe
name = "sample"
mode = "all"

[[setting]]   # the schema recipe
name = "schema"
mode = "all"
view = "schema"
