# How the fold behaves as outputs grow: Haiku 5.5, the 52 MCP tasks at L (~12.5k-50k tokens), XL (4x L)
# and XXL (16x L), once each, every setting against native. Past Claude Code's spill threshold the
# shipped default (inline) leaves results to Claude Code by design, so these settings fold the saved
# output (mode "all"). M is in dials/haiku-m.toml.
name = "haiku-sizes"
model = "claude-haiku-5-5"
bands = ["L", "XL", "XXL"]
formats = ["json", "log", "a11y", "figma"]
reps = 1
max_cost = 6

[[setting]]   # fold the saved output into the default budget
name = "all-2000"
mode = "all"

[[setting]]   # a roomier fold: does it save the reads that follow?
name = "all-6000"
mode = "all"
budget = 6000

[[setting]]   # data as its schema, which should not grow with the rows
name = "all-schema"
mode = "all"
view = "schema"
formats = ["json"]
