line-length = 110
target-version = "py315"
# harness/fetch.py runs on Python 3.13 (pyarrow has no 3.15 build yet): keep it 3.13 syntax.
per-file-target-version = { "harness/fetch.py" = "py313" }

[lint]
preview = true  # DOC501 and DOC502 are preview rules
explicit-preview-rules = true  # and only the preview rules named here are on
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "BLE", "ARG", "RUF", "DOC501", "DOC502"]
ignore = ["RUF031"]  # parentheses around a subscript's tuple: style only
