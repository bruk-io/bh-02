# Envelope compositions on real tasks: MCP-Atlas, replayed (evals.atlas, claude_code/replay_mcp.py),
# scored by the facts the answer's claims state. Haiku 5.5, native against the hook folding every
# result (mode "all") as each composition. A composition is a recipe (`view`) with any part
# swapped by a knob, for example `set = ["json_envelope.samples=none"]`.
name = "haiku-atlas"
model = "claude-haiku-5-5"
bands = ["M", "L"]
formats = ["atlas"]
reps = 2
max_cost = 4

[[setting]]   # shape summary, anomalies standouts, samples head-tail, get more rows
name = "sample"
mode = "all"

[[setting]]   # shape fields, anomalies exceptions, samples matches, get more jq
name = "schema"
mode = "all"
view = "schema"
