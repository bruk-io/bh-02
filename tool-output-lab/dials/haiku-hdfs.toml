# A real log: Loghub's HDFS_v1, the cluster's log filtered to whole blocks, its anomalies labelled
# by the people who ran it (`./lab fetch hdfs`). Haiku 5.5, native against the hook folding every
# result (mode "all": at M the default does the same; at L it would leave the spill alone).
name = "haiku-hdfs"
model = "claude-haiku-5-5"
bands = ["M", "L"]
formats = ["hdfs"]
reps = 2
max_cost = 3

[[setting]]
name = "fold"
mode = "all"
