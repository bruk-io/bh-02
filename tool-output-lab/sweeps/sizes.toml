# How the fold scales: the synthetic tasks at every size band, S (under the budget) to XXL (16x L,
# up to ~660k tokens), at two budgets and both views of data. The view changes JSON alone.
name = "sizes"
only = ["json", "log", "a11y", "figma"]
by = "band"
bands = ["S", "M", "L", "XL", "XXL"]

[grid]
view = ["sample", "schema"]
budget = [2000, 6000]
