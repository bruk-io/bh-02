# Envelopes mixed from the two JSON views' parts: every shape with every kind of anomaly and of
# sample (nav fixed at jq, which states no answers), at two budgets. The schema view is fields,
# exceptions, matches; the sample fold is summary, standouts, head-tail (recipes/sample.toml).
name = "envelopes"
only = ["json", "pypi"]

[base]
view = "envelope"

[grid]
"json_envelope.shape" = ["fields", "summary"]
"json_envelope.anomalies" = ["exceptions", "standouts"]
"json_envelope.samples" = ["none", "matches", "typical", "head-tail"]
budget = [500, 2000]
