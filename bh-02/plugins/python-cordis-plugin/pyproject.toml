[project]
name = "python-cordis-plugin"
version = "0.1.0"
description = "The python tool: a persistent Python process, started by the runner the composition names, and the `python(code)` tool that sends it inputs."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "host-paths",
    # run in the jail, under bh-02's interpreter, over a startup file's text (decision-0006 point 7)
    "ruff>=0.16.7",
]

[project.entry-points."cordis.plugins"]
python = "python_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }
host-paths = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_cordis_plugin"]
