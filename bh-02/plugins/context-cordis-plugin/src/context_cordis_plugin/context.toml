# bh-02's own context file: the project context every session starts from, read before yours
# (~/.config/bh-02/context.toml) and the project's (.bh-02/context.toml), which add to it.
#
# Each [[section]] is some files and the function that says what they mean to the model:
# `files`, patterns from the project's root (`**/` for any depth; `~/` and `/` start elsewhere),
# and `function`, a full module path, given the files that match.

# Guidance written for an agent: yours, in your home, and the project's, at its root, whole;
# those further down named, for the model to read before it works there.
[[section]]
files = [
    "~/AGENTS.md", "~/CLAUDE.md",
    "AGENTS.md", "CLAUDE.md", "AGENTS.local.md", "CLAUDE.local.md",
    "**/AGENTS.md", "**/CLAUDE.md",
]
function = "context_cordis_plugin.sections:place"

# Rule files, each applied as its frontmatter says (always, for some files, when it bears on the
# work, or only when you bring it in).
[[section]]
files = [".claude/rules/**/*.md", ".cursor/rules/**/*.mdc"]
function = "context_cordis_plugin.sections:rules"
