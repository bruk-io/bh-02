[project]
name = "context-cordis-plugin"
version = "0.1.0"
description = "What the model is told about where it is working: the directory, the branch, the project's own instructions."
requires-python = ">=3.15"
dependencies = [
    "cordis",
]

[project.entry-points."cordis.plugins"]
context = "context_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_cordis_plugin"]
