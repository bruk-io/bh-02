[project]
name = "context-cordis-plugin"
version = "0.1.0"
description = "What the model is told about who and where it is: bh-02, the directory, the branch, and the sections other rows add."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "cordis-helpers",
]

[project.entry-points."cordis.plugins"]
context = "context_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }
cordis-helpers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_cordis_plugin"]
