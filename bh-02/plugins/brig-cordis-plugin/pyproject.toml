[project]
name = "brig-cordis-plugin"
version = "0.1.0"
description = "A jail from brig: writes confined to the project, no network, credentials unreadable, graded honestly."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "brig",
]

[project.entry-points."cordis.plugins"]
brig = "brig_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }
brig = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brig_cordis_plugin"]
