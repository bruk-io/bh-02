[project]
name = "commands-cordis-plugin"
version = "0.1.0"
description = "Slash commands and line prefixes: a broker rows register into, commands over the running composition, and ! shell commands."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "cordis-helpers",
]

[project.entry-points."cordis.plugins"]
commands = "commands_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }
cordis-helpers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commands_cordis_plugin"]
