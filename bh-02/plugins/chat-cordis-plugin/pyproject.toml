[project]
name = "chat-cordis-plugin"
version = "0.1.0"
description = "The chat row: an interactive chat session over the loop, input and output."
requires-python = ">=3.15"
dependencies = [
    "cordis",
]

[project.entry-points."cordis.plugins"]
chat = "chat_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_cordis_plugin"]
