[project]
name = "tui-cordis-plugin"
version = "0.1.0"
description = "A Textual app as the ui: input, output (whose confirm asks in a modal) and frame."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "textual>=8.2",
]

[project.entry-points."cordis.plugins"]
tui = "tui_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tui_cordis_plugin"]
