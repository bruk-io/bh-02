[project]
name = "agents-cordis-plugin"
version = "0.1.0"
description = "Sub-agents in bh-02: the agent tool, each child a conversation of its own mounted in a sealed cordis realm."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "host-paths",
]

[project.entry-points."cordis.plugins"]
agents = "agents_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }
host-paths = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_cordis_plugin"]
