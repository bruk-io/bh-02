[project]
name = "runner-cordis-plugin"
version = "0.1.0"
description = "What runs the model's code: a confined runner (brig: writes confined to the project, no network, credentials unreadable, graded honestly) or an unconfined one, the rule for what runs unasked, and /release."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "cordis-helpers",
    "host-paths",
    "brig",
]

[project.entry-points."cordis.plugins"]
runner = "runner_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }
cordis-helpers = { workspace = true }
host-paths = { workspace = true }
brig = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner_cordis_plugin"]
