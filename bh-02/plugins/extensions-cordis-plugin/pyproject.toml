[project]
name = "extensions-cordis-plugin"
version = "0.1.0"
description = "Plugins the model writes itself: cordis components it loads into bh-02 while it runs, in a jail of their own."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "cordis-helpers",
]

[project.entry-points."cordis.plugins"]
extensions = "extensions_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }
cordis-helpers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extensions_cordis_plugin"]
