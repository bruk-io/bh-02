[project]
name = "kernel-cordis-plugin"
version = "0.1.0"
description = "A persistent Python kernel in a process of its own, started by whatever jail the composition names."
requires-python = ">=3.15"
dependencies = [
    "cordis",
    "host-paths",
]

[project.entry-points."cordis.plugins"]
kernel = "kernel_cordis_plugin"

[tool.uv.sources]
cordis = { workspace = true }
host-paths = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_cordis_plugin"]
