# The shipped composition, a Textual app with CodeAct (the `python` tool) as its default.
# bh-02's own loop drives Claude through Claude Code (the Claude Agent SDK, on the
# subscription), one model step at a time; the model is offered the tools rows register (here
# the kernel's `python(code)`), through standard tool calling, and its inputs run in a
# persistent kernel inside a brig jail. A row's
# id is its role; `use` is which plugin fills it, as `plugin:component` (a `cordis.plugins`
# entry point) or `module:attribute`. Order carries no meaning: dependencies decide what
# activates when.
# A session's own layer and `bh-02 --patch mine.toml` are layers over this one.

# The model: bh-02's own loop (`agent:loop`: steps classified, each call run through the tool it
# names) over one model, named: `sonnet` (Claude through Claude Code, which only carries the
# steps; credential: CLAUDE_CODE_OAUTH_TOKEN in local.env, which the row reads itself) unless
# the row's `default` says another. `opus` and `haiku` are built in too, and the models file
# (~/.config/bh-02/models.toml) adds any OpenAI-compatible model. The transcript is a row of its
# own, so switching the model (`/model NAME`) keeps the conversation. The loop reads the tools at
# a conversation's first request, once those it `requires` have registered (`wait` seconds at
# most, 30), and offers that list for the rest of it.
[[plugin]]
id = "loop"
use = "agent:loop"
config = { requires = ["python"] }

# The tools the model is offered: a broker rows register a tool with (a standard spec and the
# function that runs a call), offered in name order. It depends on nothing, so a tool's row
# restarting (the kernel's, on /clear) reloads neither the loop nor any other row.
[[plugin]]
id = "tools"
use = "agent:tools"

[[plugin]]
id = "model"
use = "models:model"

# The models there are, and which one the model row names: read fresh each time, depending on
# the loader alone, so `/model` (the operator) and the status bar never reload with a switch.
[[plugin]]
id = "models"
use = "models:catalog"

[[plugin]]
id = "transcript"
use = "agent:transcript"

# Where the loop reads the prompt (a section function may read many files) and asks `notes`:
# off the event loop the app shares, one call at a time. Nothing
# stops a reading part-way, so one a stopped reply left running is waited for before the next
# begins. A row of its own that depends on nothing, so /clear and /model, which reload the loop,
# keep it: Ctrl-C after Ctrl-C leaves one reading running, however often the loop reloads.
[[plugin]]
id = "executor"
use = "agent:executor"

# What the model is told with a call's result: a broker of functions rows add, each given the
# tool's name, the call's input, its result and the files it opened, the loop calling each after
# every call. Memory's on-demand files (a subdirectory's CLAUDE.md, a rule
# for some files, given when an input first opens a file they cover) add to it, depending on
# `transcript`, so a new conversation (/clear) is told afresh and a resumed one is not told
# again what its transcript holds.
[[plugin]]
id = "notes"
use = "agent:notes"

# Memory, as Claude Code has it: the managed policy's CLAUDE.md, yours (~/.claude/CLAUDE.md and
# ~/.claude/rules/), the CLAUDE.md files from the filesystem's root down to the project's (and
# AGENTS.md where there is none), the files they import and the project's rules, a section of the
# system prompt; `/memory` lists them. The on-touch row asks it what loads for the files an input
# opened, so it has no config: set `root`, `home`, `instruction_files` or `excludes` on the
# `memory` row and they hold for both.
[[plugin]]
id = "memory"
use = "memory:memory"

[[plugin]]
id = "on-touch"
use = "memory:on_touch"

# Auto memory: the notes the model keeps for itself across conversations, in the project's own
# directory outside the repository ($XDG_STATE_HOME/bh-02/projects/<project>/memory, which the
# jail lets an input write), and the MEMORY.md index, read at the start of each conversation. A
# row of its own over `transcript`, so a new conversation reads the index afresh; set
# `disabled = true` on it to turn auto memory off.
[[plugin]]
id = "memory-auto"
use = "memory:auto"

# The app: binds `input`, `output` and `frame` (where rows push status). It depends on its
# config alone, so no reload elsewhere restarts it.
[[plugin]]
id = "ui"
use = "tui:app"

[[plugin]]
id = "chat"
use = "chat:session"

# The kernel: a persistent Python namespace, and the `python(code)` tool, which it registers with
# `tools`, adding what the model is told about it to the system prompt. Jailed, its inputs run
# without asking; unjailed (`kernel:unjailed` below), each is put to the person
# first (the `approval` row). A new kernel runs its startup files first (config `startup`, by
# default the person's `$XDG_CONFIG_HOME/bh-02/kernel.py`, then the project's `.bh-02/kernel.py`,
# the only one the model may edit); unjailed, the model is told to run them as inputs instead.
[[plugin]]
id = "kernel"
use = "kernel:kernel"

# `bh-02 --no-jail` puts `kernel:unjailed` here, which confines nothing.
[[plugin]]
id = "jail"
use = "brig:jail"

# Whether what the model asked for may run: each call (the loop asks) and each extension to load
# (the extensions row asks). At once when it runs in a jail that confines it (writes and network
# enforced); else (an unconfined jail, a tool that runs in bh-02's own process) the person is asked, through the ui's approval modal, and only a yes runs it. It depends on the
# jail and the ui, not the kernel, so `/clear` leaves it up. It runs in bh-02's own process:
# only a layer replaces it; an extension has no way to.
[[plugin]]
id = "approval"
use = "kernel:approval"

# `/release`: stops the kernel until the next input, and with it its jail, which on Linux frees
# what the jail holds on the host (where bh-02 looks for its credential: how to add one
# mid-session); the jail stops the extensions' worker too, and the extensions load again once
# the next input has started the kernel. A row of its own over `kernel` and `commands`, so the
# kernel depends on its jail alone.
[[plugin]]
id = "release"
use = "kernel:release"

# The status bar: the session's id, the model and its provider, and the kernel's jail grades
# (usage is the app's own). A small row over `kernel`, `loader`, `models`, `sessions` and
# `frame`, so a new kernel (/clear, a new jail) reloads this and never the app.
[[plugin]]
id = "status"
use = "tui:status"

# The system prompt: who the model is, where it is working (the directory and the git branch),
# then the sections rows add, sorted by name (how to extend bh-02, then memory's). A broker,
# depending on its config alone.
[[plugin]]
id = "system"
use = "agent:system"

# Slash commands: a broker rows register commands into (and a layer's rows claim line prefixes
# in), and the operator's own (/rows, /explain, /restart, /clear, /model), which act through the
# loader's handle. The chat row asks it which lines are commands (`claims`).
[[plugin]]
id = "commands"
use = "commands:registry"

[[plugin]]
id = "operator"
use = "commands:operator"

# `/compact [WHAT TO KEEP]`: the model summarises the conversation, and a new one begins from
# the summary, written over the transcript row's file (its `path`; the old kept as `.bak`, then
# `.bak.2`, ...): the loop and the transcript restart, so the prompt is read afresh, and the
# kernel keeps its namespace, which the summary names. A row of its own over `model`, `tools`
# (the specs, offered as the loop offers them), the loader, `commands` and `output`, not the operator, which never depends on
# the model. Ctrl-C doesn't stop a command (quitting does), so the model has `timeout` seconds
# (300) to answer, and a note says so as it begins.
[[plugin]]
id = "compact"
use = "agent:compact"

# `!COMMAND`: a line starting with `!` runs as a shell command, as you (not in the jail), in the
# project, through your $SHELL. The app owns the terminal, so its output is captured, and Ctrl-C
# can't stop a command, so it is stopped at its `timeout` (120 s; config: `prefix`, `cwd`,
# `timeout`, `shell`), or when you quit. What it printed is shown, and the model reads it with
# your next message, never mid-turn (`commands` holds it meanwhile, so `/model` keeps it). The
# prefix is claimed in `commands`, which only a row in a layer can do: an extension can't.
[[plugin]]
id = "shell-command"
use = "commands:shell_command"

# The command palette (Ctrl-P) offers the commands broker's commands.
[[plugin]]
id = "palette"
use = "tui:palette"

# The model's own extensions: cordis components it writes to the project's `.bh-02/plugins/`,
# loaded while bh-02 runs into a worker the `jail` row starts, so they run as confined as its
# inputs (jailed, they load without asking; unjailed, each is put to the person first). What they
# add, slash commands, status fields and sections of the model's prompt, goes into `commands`,
# `frame` and `system`, and leaves with them. Its own section tells the model how.
[[plugin]]
id = "extensions"
use = "extensions:extensions"
