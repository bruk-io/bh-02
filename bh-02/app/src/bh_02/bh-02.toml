# The shipped composition, a layer (docs/bh-02/using/layers.md); its rows: docs/bh-02/how-it-works/rows-and-layers.md.

# The agent loop; `requires`: the tools a conversation waits for (`wait`, 30 s) before it begins.
[[plugin]]
id = "loop"
use = "agent:loop"
config = { requires = ["python"] }

# The broker of the model's tools; it depends on nothing, so a tool's restart reloads no other row.
[[plugin]]
id = "tools"
use = "agent:tools"

# Sub-agents: the `agent` tool, each child a conversation of its own in a sealed realm, its rows
# copied from these (`rows`), its questions labelled; `start`: how long a child has to come up (30 s).
[[plugin]]
id = "agents"
use = "subagents:parent"

# The status bar's agents field, `agents: N running`, while a sub-agent runs (absent at none).
[[plugin]]
id = "agents-status"
use = "subagents:status"

# The model, by name: `default` (`ENDPOINT/MODEL`; unset, the models file's), which `--model` and
# `/model` set in the session's layer.
[[plugin]]
id = "model"
use = "models:model"

# The models there are and which one the model row names; `/model` and the status bar read it.
[[plugin]]
id = "models"
use = "models:catalog"

# The conversation, its own row so a model switch keeps it; the session's layer sets its `path`.
[[plugin]]
id = "transcript"
use = "agent:transcript"

# Where the loop reads the prompt and asks `asides`, off the event loop; it depends on nothing.
[[plugin]]
id = "executor"
use = "agent:executor"

# The broker of what the model is told beside a call's result; only rows in a layer add to it.
[[plugin]]
id = "asides"
use = "agent:asides"

# The broker of what rows keep across `/compact`, told after it (the python row: its names); it
# depends on nothing.
[[plugin]]
id = "carried"
use = "agent:carried"

# The broker asked before a tool opens a file; the on-touch row refuses a first write.
[[plugin]]
id = "access"
use = "agent:access"

# Claude Code's memory files, a section of the prompt; its config holds for `on-touch` too.
[[plugin]]
id = "memory"
use = "memory:files"

# Memory that loads on demand, told as an aside to the first input that opens a file it covers.
[[plugin]]
id = "on-touch"
use = "memory:on_touch"

# Auto memory, the memories the model keeps for itself, and the `memory` tool that saves, reads and
# deletes them (it runs in bh-02's own process, outside the jail, and is never asked); `disabled = true`
# turns both off.
[[plugin]]
id = "memory-auto"
use = "memory:auto"

# The Textual app: binds `input`, `output` and `frame`, and depends on its config alone.
[[plugin]]
id = "ui"
use = "tui:ui"

# The chat: reads your lines, shows replies, runs commands; binds `done`, which the shell awaits.
[[plugin]]
id = "chat"
use = "chat:converse"

# The python tool and its Python process; config `startup`: the files a new process runs first;
# `mypy_cache`: where mypy keeps its cache for the type check of those files (default `.bh-02/mypy_cache`).
[[plugin]]
id = "python"
use = "python:tool"

# Starts the model's code, each program in a brig jail; `--no-jail` puts `runner:unconfined` here.
[[plugin]]
id = "runner"
use = "runner:confined"

# The one rule for what runs unasked; it runs in bh-02's process, so only a layer replaces it.
[[plugin]]
id = "approval"
use = "runner:approval"

# `/release`: each row stops its own program, then the runner frees what its jails held.
[[plugin]]
id = "release"
use = "runner:release"

# The status bar's session and model fields.
[[plugin]]
id = "status"
use = "tui:status"

# The status bar's jail field: the grades of the runner's last start.
[[plugin]]
id = "grades"
use = "tui:grades"

# The system prompt: a broker of the sections rows add, sorted by name.
[[plugin]]
id = "system"
use = "agent:system"

# The broker of slash commands and line prefixes; the chat asks it which lines are commands.
[[plugin]]
id = "commands"
use = "commands:registry"

# `/rows`, `/explain ROW` and `/restart ROW`, through the loader.
[[plugin]]
id = "operator"
use = "commands:operator"

# The restarts commands ask for, one at a time; the chat reads your next line once none is pending.
[[plugin]]
id = "jobs"
use = "commands:jobs"

# `/model [NAME]`: lists the models, or switches by name in the session's layer.
[[plugin]]
id = "switch"
use = "models:switch"

# `/clear` and `/compact`; config `timeout`: the seconds `/compact`'s summary may take (300);
# `clear`: the rows `/clear` restarts, `agents` among them so a new conversation ends the sub-agents
# running for the old one (`/compact` keeps them).
[[plugin]]
id = "conversation"
use = "agent:conversation"
config = { clear = ["loop", "transcript", "python", "agents"] }

# `!COMMAND`: your shell, as you, unjailed; config `timeout` (120 s), `prefix`, `cwd`, `shell`.
[[plugin]]
id = "shell-command"
use = "commands:shell_command"

# The command palette (Ctrl-P), offering the commands broker's commands.
[[plugin]]
id = "palette"
use = "tui:palette"

# The model's own extensions, `.bh-02/plugins/NAME.py`, loaded into the extensions process.
[[plugin]]
id = "extensions"
use = "extensions:process"
