# The shipped composition: bh-02 is a CodeAct harness in a Textual app. bh-02's own loop drives
# Claude through Claude Code (the Claude Agent SDK, on the subscription), one model step at a
# time; the model has one tool, `python(code)`, through standard tool calling, and its inputs run
# in a persistent kernel inside a brig jail. A row's id is its role; `use`
# is which plugin fills it, as `plugin:component` (a `cordis.plugins` entry point) or
# `module:attribute`. Order carries no meaning: dependencies decide what activates when.
# A session's own layer and `bh-02 --patch mine.toml` are layers over this one.

# The model: bh-02's own loop (`agent:loop`: steps classified, each call run as an input in the
# kernel) over one model, named: `sonnet` (Claude through Claude Code, which only carries the
# steps; credential: CLAUDE_CODE_OAUTH_TOKEN in local.env, which the row reads itself) unless
# the row's `default` says another. `opus` and `haiku` are built in too, and the models file
# (~/.config/bh-02/models.toml) adds any OpenAI-compatible model. The transcript is a row of its
# own, so switching the model (`/model NAME`) keeps the conversation.
[[plugin]]
id = "loop"
use = "agent:loop"

[[plugin]]
id = "model"
use = "models:model"

# The models there are, and which one the model row names: read fresh each time, depending on
# the loader alone, so `/model` (the operator) and the status bar never reload with a switch.
[[plugin]]
id = "models"
use = "models:catalog"

[[plugin]]
id = "transcript"
use = "agent:transcript"

# What the model is told with an input's result: a broker of functions rows add, each given the
# input's code, its result and the project files it opened (`kernel.touched()`), the loop
# calling each after every input. The shell hints (an input that ran `cat` or `sed` is told how
# Python does that here) and the context files' on-touch sections (a subdirectory's AGENTS.md or
# CLAUDE.md, a rule for some files, given when an input first opens a file they cover) add to
# it, each depending on `transcript`, so a new conversation (/clear) is told afresh. The on-touch
# row asks `system` what the context files say, so it has no config: set `root`, `home` or
# `files` on the `system` row and they hold for both.
[[plugin]]
id = "memory"
use = "agent:memory"

[[plugin]]
id = "shell-hints"
use = "kernel:shell_hints"

[[plugin]]
id = "on-touch"
use = "context:on_touch"

# The app: binds `input`, `output` and `frame` (where rows push status). It depends on its
# config alone, so no reload elsewhere restarts it.
[[plugin]]
id = "ui"
use = "tui:app"

[[plugin]]
id = "chat"
use = "chat:session"

# The kernel: a persistent Python namespace, and the model's one tool, `python(code)`. Jailed,
# its inputs run without asking; unjailed (`kernel:unjailed` below), each is put to the person
# first (the `approval` row).
[[plugin]]
id = "kernel"
use = "kernel:kernel"

# `bh-02 --no-jail` puts `kernel:unjailed` here, which confines nothing.
[[plugin]]
id = "jail"
use = "brig:jail"

# Whether the model's code may run: each input (the loop asks) and each extension to load (the
# extensions row asks). At once when the jail confines it (writes and network enforced); else
# the person is asked, through the ui's approval modal, and only a yes runs it. It depends on the
# jail and the ui, not the kernel, so `/clear` leaves it up. It runs in bh-02's own process:
# only a layer replaces it; an extension has no way to.
[[plugin]]
id = "approval"
use = "kernel:approval"

# `/release`: stops the kernel until the next input, and with it its jail, which on Linux frees
# what the jail holds on the host (where bh-02 looks for its credential: how to add one
# mid-session). A row of its own over `kernel` and `commands`, so the kernel depends on its jail
# alone.
[[plugin]]
id = "release"
use = "kernel:release"

# The status bar: the session's id, the model and its provider, and the kernel's jail grades
# (usage is the app's own). A small row over `kernel`, `loader`, `models`, `sessions` and
# `frame`, so a new kernel (/clear, a new jail) reloads this and never the app.
[[plugin]]
id = "status"
use = "tui:status"

[[plugin]]
id = "system"
use = "context:project"

# Slash commands: a broker rows register commands into (and a layer's rows claim line prefixes
# in), and the operator's own (/rows, /explain, /restart, /clear, /model), which act through the
# loader's handle. The chat row asks it which lines are commands (`claims`).
[[plugin]]
id = "commands"
use = "commands:registry"

[[plugin]]
id = "operator"
use = "commands:operator"

# `!COMMAND`: a line starting with `!` runs as a shell command, as you (not in the jail), in the
# project, through your $SHELL. The app owns the terminal, so its output is captured, and Ctrl-C
# can't stop a command, so it is stopped at its `timeout` (120 s; config: `prefix`, `cwd`,
# `timeout`, `shell`). What it printed is shown, and the model reads it with your next message,
# never mid-turn. The prefix is claimed in `commands`, which only a row in a layer can do: an
# extension can't.
[[plugin]]
id = "shell-command"
use = "commands:shell_command"

# The command palette (Ctrl-P) offers the commands broker's commands.
[[plugin]]
id = "palette"
use = "tui:palette"

# The model's own extensions: cordis components it writes to the project's `.bh-02/plugins/`,
# loaded while bh-02 runs into a worker the `jail` row starts, so they run as confined as its
# inputs (jailed, they load without asking; unjailed, each is put to the person first). What they
# add, slash commands, status fields and sections of the model's prompt, goes into `commands`,
# `frame` and `system`, and leaves with them. Its own section tells the model how.
[[plugin]]
id = "extensions"
use = "extensions:extensions"
