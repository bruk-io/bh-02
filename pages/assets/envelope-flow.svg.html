<figure class="flow">
<svg viewBox="0 0 340 418" role="img" aria-label="The hook saves the full tool output to a file and puts only the envelope, about a twentieth of the size, in the model's context. The model can still open the file with the commands in the envelope's get more section." style="font-family: var(--bh-font-sans)">
  <defs>
    <marker id="flow-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="90" y="8" width="160" height="50" rx="6" fill="none" stroke="currentColor"/>
  <text x="170" y="29" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Tool output</text>
  <text x="170" y="47" text-anchor="middle" font-size="11" fill="currentColor">100 invoices, ~2,800 tokens</text>

  <line x1="170" y1="58" x2="170" y2="90" stroke="currentColor" marker-end="url(#flow-ah)"/>
  <text x="178" y="78" font-size="11" fill="currentColor">after each tool call</text>

  <rect x="120" y="92" width="100" height="32" rx="6" fill="none" stroke="currentColor"/>
  <text x="170" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Hook</text>

  <line x1="150" y1="124" x2="72" y2="176" stroke="currentColor" marker-end="url(#flow-ah)"/>
  <text x="100" y="146" text-anchor="end" font-size="11" fill="currentColor">saves all of it</text>
  <line x1="190" y1="124" x2="238" y2="176" stroke="currentColor" marker-end="url(#flow-ah)"/>
  <text x="226" y="146" font-size="11" fill="currentColor">writes</text>

  <rect x="10" y="178" width="120" height="60" rx="6" fill="none" stroke="currentColor"/>
  <text x="70" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Saved file</text>
  <text x="70" y="217" text-anchor="middle" font-size="11" fill="currentColor">the full output</text>
  <text x="70" y="231" text-anchor="middle" font-size="11" fill="currentColor">~2,800 tokens</text>

  <rect x="150" y="178" width="180" height="26" style="fill: var(--viz-acc); fill-opacity: 0.16"/>
  <rect x="150" y="178" width="180" height="154" rx="2" fill="none" style="stroke: var(--viz-acc)" stroke-width="1.5"/>
  <text x="240" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">Envelope, ~140 tokens</text>
  <line x1="150" y1="236" x2="330" y2="236" stroke="currentColor" stroke-opacity="0.3"/>
  <line x1="150" y1="268" x2="330" y2="268" stroke="currentColor" stroke-opacity="0.3"/>
  <line x1="150" y1="300" x2="330" y2="300" stroke="currentColor" stroke-opacity="0.3"/>
  <rect x="151" y="205" width="4" height="30" style="fill: var(--sec-shape)"/>
  <rect x="151" y="237" width="4" height="30" style="fill: var(--sec-anom)"/>
  <rect x="151" y="269" width="4" height="30" style="fill: var(--sec-samp)"/>
  <rect x="151" y="301" width="4" height="30" style="fill: var(--sec-more)"/>
  <g font-size="11" fill="currentColor">
    <text x="162" y="218" font-weight="600" style="font-family: var(--bh-font-mono)">shape</text>
    <text x="162" y="231">exact counts</text>
    <text x="162" y="250" font-weight="600" style="font-family: var(--bh-font-mono)">anomalies</text>
    <text x="162" y="263">items that differ</text>
    <text x="162" y="282" font-weight="600" style="font-family: var(--bh-font-mono)">samples</text>
    <text x="162" y="295">items copied as they are</text>
    <text x="162" y="314" font-weight="600" style="font-family: var(--bh-font-mono)">get more</text>
    <text x="162" y="327">commands to read the file</text>
  </g>

  <line x1="240" y1="332" x2="240" y2="372" stroke="currentColor" marker-end="url(#flow-ah)"/>
  <text x="248" y="356" font-size="11" fill="currentColor">in context</text>

  <rect x="150" y="374" width="180" height="36" rx="6" fill="none" stroke="currentColor"/>
  <text x="240" y="397" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Model</text>

  <path d="M150,392 H40 V240" fill="none" stroke="currentColor" stroke-dasharray="4 4" marker-end="url(#flow-ah)"/>
  <text x="48" y="306" font-size="11" fill="currentColor">can open it</text>
  <text x="48" y="320" font-size="11" fill="currentColor">with get more</text>
</svg>
<figcaption>The hook saves the full output to a file and puts only the envelope, about a twentieth of the size, in the model's context. The model can still open the file with the commands in the envelope's get more section.</figcaption>
</figure>
